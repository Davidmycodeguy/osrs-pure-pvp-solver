name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (pure_solver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Test
        run: python -m pytest tests -q

  rust:
    name: Rust (pure_math)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pure_math
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pure_math
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test
        run: cargo test --release

  viewer:
    name: Viewer (PureLab)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npx oxlint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
