[package]
name = "pure_math"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Davidmycodeguy/pure"
description = "Exact OSRS F2P combat math for the pure solver: formula evaluation, account/gear enumeration, kit ranking."

[lib]
name = "pure_math"
path = "src/lib.rs"

[[bin]]
name = "pure_math"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
csv = "1"
rayon = "1"
anyhow = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
num-rational = { version = "0.4", features = ["num-bigint"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
